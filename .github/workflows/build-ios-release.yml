name: Build iOS Release

on:
  release:
    types: [published]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 4. Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      - name: 5. Configurar EAS y Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 6. Compilar ejecutable .ipa en apps/web
        working-directory: apps/web
        env:
          NODE_ENV: production
          EXPO_NO_DOCTOR: "1"
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --non-interactive --output=./build-output/app-release.ipa

      - name: 7. Adjuntar ejecutable .ipa a la Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/build-output/app-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}