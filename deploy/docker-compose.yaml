services:
  postgres:
    image: postgis/postgis:18-master
    container_name: ski_tracker-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ski_tracker
      POSTGRES_USER: ski_tracker
      POSTGRES_PASSWORD: ski_tracker
    volumes:
      - pgdata_tracker:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ski_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - data-minio:/data
    environment:
      MINIO_ROOT_USER: changemeuser
      MINIO_ROOT_PASSWORD: changemepass

  minio-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dockerminio http://minio:9000 changemeuser changemepass;
      /usr/bin/mc mb dockerminio/yourbucketname;
      exit 0;
      "

volumes:
  data-minio:
  pgdata_tracker: